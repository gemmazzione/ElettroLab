# Pubblicazione automatica su hosting Aruba via FTP.
# A ogni push su main: test → build → caricamento dei soli file cambiati.
#
# Configurazione (una volta sola) in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER     es. ftp.tuodominio.it
#              FTP_USERNAME   utente FTP di Aruba
#              FTP_PASSWORD   password FTP di Aruba
#   Variables: FTP_SERVER_DIR cartella di destinazione, con "/" finale,
#                             es. /www.tuodominio.it/electrolab/
#              FTP_PROTOCOL   facoltativa: ftps (predefinita, cifrato) oppure ftp
# Senza questi dati il workflow esegue test e build ma salta la pubblicazione.
#
# Account utente (facoltativi, database MySQL dell'hosting):
#   Secrets:   DB_NAME        nome del database (AlterVista: di solito my_nomesito)
#              DB_USER        utente del database (AlterVista: di solito nomesito)
#              DB_PASSWORD    password del database (può essere vuota se l'hosting non la prevede)
#              SETUP_TOKEN    codice segreto per creare l'amministratore la prima volta
#   Variables: DB_HOST        facoltativa, predefinito localhost

name: Pubblica su Aruba

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aruba
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Test automatici
        run: npm test

      - name: Build
        run: npm run build

      # Account (facoltativo): config.php dell'API creato dai secrets, mai salvato nel repository.
      # Valori codificati in base64 per evitare qualsiasi problema di caratteri speciali.
      - name: Configura il database degli account
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        if: env.DB_NAME != ''
        run: |
          node -e '
            const e = process.env;
            const cfg = {
              dsn: `mysql:host=${e.DB_HOST || "localhost"};dbname=${e.DB_NAME};charset=utf8mb4`,
              user: e.DB_USER || "",
              password: e.DB_PASSWORD || "",
              setup_token: e.SETUP_TOKEN || "",
            };
            const b64 = Buffer.from(JSON.stringify(cfg)).toString("base64");
            require("fs").writeFileSync("dist/api/config.php",
              "<?php\nif (!defined(\"ELECTROLAB_API\")) { http_response_code(404); exit; }\nreturn json_decode(base64_decode(\"" + b64 + "\"), true);\n");
          '
          echo "config.php creato per il database $DB_NAME"

      - name: Pubblica via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        if: env.FTP_SERVER != '' && env.FTP_SERVER_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}

      - name: Pubblicazione non configurata
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        if: env.FTP_SERVER == '' || env.FTP_SERVER_DIR == ''
        run: echo "::notice::Build completata. Pubblicazione saltata - imposta i secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD e la variabile FTP_SERVER_DIR."
